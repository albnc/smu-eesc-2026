# Sínteses dos palestrantes. Edite aqui e rode: python3 _fonte/gera_conteudo.py
# Os textos são breves por opção editorial — uma linha de vínculo, uma de tema.
# REVISAR antes de publicar: as sínteses foram redigidas a partir das cartas-convite
# e da programação; confirme títulos, vínculos e recorte de pesquisa com cada convidado.

secoes:
  - nome: "Palestras e sessões técnicas"
    pessoas:
      - nome: "Prof. Dr. Rodrigo Castelan Carlson"
        inst: "UFSC"
        tema: "Tutorial de número de replicações e validade estatística de resultados de microssimulação."
        quando: "8/set · 16h00–18h00"
        sintese: "Pesquisador em controle e automação aplicados a sistemas de tráfego. No simpósio, trata do problema prático que antecede toda conclusão obtida por simulação: quantas replicações são necessárias para que o resultado seja estatisticamente defensável."

      - nome: "Prof. Dr. Flávio Guilherme Vaz de Almeida Filho"
        inst: "EESC-USP"
        tema: "Estimativas de emissões de GEE no laboratório, no mundo real e em simulações."
        quando: "10/set · 8h00–9h30"
        sintese: "Membro da equipe do projeto. Confronta três fontes de estimativa de emissões de gases de efeito estufa — ensaio laboratorial, medição em via e modelo de simulação — e discute o que cada uma consegue (e não consegue) responder."

      - nome: "Prof. Dr. Felipe Caleffi"
        inst: "UFSM"
        tema: "Integração de microssimulador de tráfego e realidade virtual com foco em replanejamento urbano; trabalhos de conclusão de curso da UFSM com aplicações de microssimulação."
        quando: "10/set · 10h00–12h00"
        sintese: "Membro da equipe do projeto. Apresenta o acoplamento entre microssimulação e realidade virtual como instrumento de avaliação de intervenções urbanas, além do panorama das aplicações desenvolvidas por seus orientandos na UFSM."

      - nome: "Prof. Dr. José Elievam Bessa Júnior"
        inst: "UFMG"
        tema: "Impacto de veículos autônomos no meio urbano por meio de simulação de tráfego: resultados e perspectivas futuras."
        quando: "10/set · 14h00–15h30"
        sintese: "Membro da equipe do projeto. Discute como a introdução de veículos autônomos altera o desempenho de redes urbanas, a partir de cenários de simulação construídos ao longo do projeto."

      - nome: "Prof. Dr. André Luiz Barbosa Nunes da Cunha"
        inst: "EESC-USP · coordenação"
        tema: "Resultados das pesquisas EESC-USP e fechamento do projeto."
        quando: "10/set · 16h00–18h00"
        sintese: "Coordenador do projeto. Consolida os resultados obtidos entre 2023 e 2026 pelo Departamento de Engenharia de Transportes da EESC-USP e abre a discussão sobre a agenda de pesquisa que se segue ao encerramento."

  - nome: "Curso — Dados censitários e acessibilidade urbana em R"
    descricao: "Curso de dia inteiro (9/set), em quatro módulos alternando teoria e prática em R. Vagas limitadas."
    pessoas:
      - nome: "Prof. Dr. Jorge Ubirajara Pedreira Junior"
        inst: "UFBA"
        tema: "Módulos de dados censitários e acessibilidade urbana."
        quando: "9/set · dia inteiro"
        sintese: "Conduz os módulos que ligam a base censitária brasileira às medidas de acessibilidade urbana, do tratamento dos setores censitários ao cálculo de indicadores em R."

      - nome: "Dr. Thiago Vinicius Louro"
        inst: "EESC-USP"
        tema: "Módulos práticos em R."
        quando: "9/set · dia inteiro"
        sintese: "Responsável, junto com a equipe, pela parte prática do curso: manipulação de dados, cálculo de indicadores e visualização dos resultados em R."

      - nome: "Dr. Lucas Brandão Monteiro de Assis"
        inst: "EESC-USP"
        tema: "Módulos práticos em R."
        quando: "9/set · dia inteiro"
        sintese: "Atua nos módulos práticos, com foco na reprodutibilidade das rotinas e na aplicação dos indicadores a estudos de caso."

  - nome: "Equipe do projeto"
    descricao: "Pesquisadores da equipe que participam das sessões de discussão e da reunião de fechamento."
    pessoas:
      - nome: "Prof. Dr. Claudio Luiz Marte"
        inst: "EPUSP"
        sintese: "Membro da equipe do projeto, na interface entre sistemas inteligentes de transportes e infraestrutura viária."

      - nome: "Prof. Dr. José Reynaldo Anselmo Setti"
        inst: "EESC-USP"
        sintese: "Membro da equipe do projeto, com atuação de longa data em modelagem e simulação de tráfego."

      - nome: "Profa. Dra. Marina Leite de Barros Baltar"
        inst: "UFRJ"
        sintese: "Membro da equipe do projeto, com atuação em análise de redes e mobilidade urbana."
